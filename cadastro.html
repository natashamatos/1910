    <main class="d-flex justify-content-center align-items-center">
        
        <form id = "form_cadastro">
            <h1 style="text-align: center;">Cadastre-se</h1>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome aqui" required class="input_texto">
            <label for="celular">Celular:</label>
            <input type="tel" id="celular" placeholder="(00) 99999-9999" required class="input_texto">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" required class="input_texto">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="email@email.com" required class="input_texto">
            <label for = "senha">Senha:</label>
            <input type = "password" id = "senha" required class = "input_texto">

            <!--  
            <label for="cep">CEP:</label>
            <input type="text" id="cep" onblur="pesquisarCep()" placeholder="00000-000" required class="input-texto">
            <p id="erro"></p>
            <label for="rua">Rua:</label>

            <label for="numero">Número:</label>

            <label for="bairro">Bairro:</label>

            <input type="submit" id="btn_enviar" value="Enviar Cadastro" class="btn_enviar">
        </form>

         <!-- ALERTA TOAST -->
         <div class="position-fixed" style="top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1050;">
            <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
                <div class="d-flex">
                    <div class="toast-body" id="toast-message">
                        Mensagem
                    </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>
        
    </main>
    <footer> </footer>

    <script>
        function pegar_dados() {
            dados = {
                nome: document.getElementById("nome").value,
                cpf: document.getElementById("cpf").value,
                celular: document.getElementById("celular").value,
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value
            }
            return dados
        }
        const form_cadastro = document.getElementById("form_cadastro")
        const btn_enviar = document.getElementById("btn_enviar")
        form_cadastro.addEventListener("submit", async (event) => {
            event.preventDefault() // evita o recarregamento da página
            btn_enviar.disabled = true
            btn_enviar.value = "Enviando..."
            const dados = pegar_dados()
            try {
                const resposta = await fetch(
                    "http://localhost:3000/Cliente", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(dados)
                    }
                )
                if (!resposta.ok) {throw new Error("Erro na API")}
                mostrarToast("✅ Cadastro enviado com sucesso!", "bg-success");
                form_cadastro.reset()
            } catch (error) {
                mostrarToast("❌ Falha ao enviar. " + error, "bg-danger");
            } finally {
                btn_enviar.disabled = false
                btn_enviar.value = "Enviar Cadastro"
            }
        })
    </script>
