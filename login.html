<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <title>Login</title>
</head>
<body>
    <header>
        <!-- <img src="logo.png" alt="Logo do e-commerce Augusto Multimarcas"> -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid justify-content-center">
                <a class="navbar-brand" href="#">
                    <img src="logo.png" height="100" alt="">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0 justify-content-center" id="navbarNav">
                    <ul class="navbar-nav text-center">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">PRODUTOS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="carrinho.html">CARRINHO</span></a>
                        </li>
                        <li class="nav-item active" id="nav-login">
                            <a class="nav-link" href="login.html">LOGIN</a>
                        </li>
                    </ul>
                    <div class="dropdown m-3">
                        <button id="user-info" class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="display: none">
                            Opções
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="cadastro.html">Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main class="d-flex justify-content-center align-items-center">
        <form id="form_login">
            <h1 style="text-align: center;">Login</h1>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="email@email.com" required class="input_texto">
            <label for = "senha">Senha:</label>
            <input type = "password" id = "senha" required class = "input_texto">
            <p style="text-align: center;">Não possui cadastro? Cadastre-se <a href="./cadastro.html">clicando aqui</a></p>

            <input type="submit" value="Entrar" class="btn_enviar" id="btn_enviar">
        </form>
        <!-- ALERTA TOAST -->
        <div class="position-fixed" style="top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1050;">
            <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
                <div class="d-flex">
                    <div class="toast-body" id="toast-message">
                        Mensagem
                    </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>
        <!-- FIM ALERTA TOAST -->
    </main>
    <footer> </footer>

    <script>
        function pegar_dados() {
            const dados = {
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value
            }
            return dados
        }
        const form = document.getElementById("form_login")
        const btn_enviar = document.getElementById("btn_enviar")
        form.addEventListener("submit", async (event) => {
            event.preventDefault() // evita o recarregamento da página
            btn_enviar.disabled = true
            btn_enviar.value = "Entrando..."
            const dados = pegar_dados()
            try {
                const resposta = await fetch(
                    "http://localhost:3000/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(dados)
                    }
                )
                const json_resposta = await resposta.json()
                if (!resposta.ok) {
                    if (resposta.status == 401) {
                        throw new Error(json_resposta.msg)
                    } else {
                        throw new Error("Erro inesperado na API")
                    }
                }
                localStorage.setItem("nome_cliente", json_resposta.nome)
                localStorage.setItem("token", json_resposta.token)
                window.location.href = "index.html"
            } catch (error) {
                alert(error)
            } finally {
                btn_enviar.disabled = false
                btn_enviar.value = "Entrar"
            }
        })
    </script>

    <script src="./pages.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
